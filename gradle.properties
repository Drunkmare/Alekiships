# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.console=plain
org.gradle.configuration-cache=true
# Mod stuff
modId=alekiships
# The human-readable display name for the mod.
modName=aleki's Nifty Ships
modLicense=MIT
# The mod version. See https://semver.org/
modVersion=2.0.0
modGroupId=com.alekiponi.alekiships
modAuthors=alekiponi, Traister101
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
modDescription=A new generation of vanilla-friendly ships. Simulated sailing, placeable containers, walkable decks -- oh, and cannons!
# The issue tracker for the mod. This is often the issue tab in your GitHub repo or similar source forges
modIssueTracker=https://gitlab.com/alekiponi1/alekiships/-/issues