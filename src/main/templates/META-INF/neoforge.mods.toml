# Loader metadata
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_issue_tracker}"

# Us
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "alekiponi"
credits = "Contributors: alekiponi, Traister101, vexxel. Translations: PL - Freeziu, RU - Windflame, CZ - celdak"
description = '''${mod_description}'''

# Dependencies
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "${jei_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "${mod_id}.mixins.json"